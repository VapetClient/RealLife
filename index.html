<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>3D Модель Человека (3D Human Model Viewer)</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      background: #0f172a;
      color: #f8fafc;
      overflow: hidden;
      width: 100vw;
      height: 100vh;
    }
    #canvas-container {
      width: 100%;
      height: 100%;
      position: absolute;
      top: 0;
      left: 0;
    }
    .ui-panel {
      position: absolute;
      top: 20px;
      left: 20px;
      background: rgba(15, 23, 42, 0.85);
      backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.12);
      border-radius: 14px;
      padding: 20px 24px;
      max-width: 360px;
      box-shadow: 0 20px 35px rgba(0, 0, 0, 0.5);
      z-index: 10;
    }
    .title {
      font-size: 1.35rem;
      font-weight: 700;
      margin-bottom: 6px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    .subtitle {
      font-size: 0.85rem;
      color: #94a3b8;
      margin-bottom: 16px;
      line-height: 1.4;
    }
    .stat-row {
      display: flex;
      justify-content: space-between;
      font-size: 0.85rem;
      padding: 6px 0;
      border-bottom: 1px solid rgba(255, 255, 255, 0.06);
    }
    .stat-label {
      color: #94a3b8;
    }
    .stat-value {
      color: #38bdf8;
      font-weight: 600;
    }
    .controls-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      margin-top: 16px;
    }
    button {
      background: #1e293b;
      color: #f1f5f9;
      border: 1px solid rgba(255, 255, 255, 0.15);
      padding: 9px 12px;
      border-radius: 8px;
      font-size: 0.82rem;
      cursor: pointer;
      transition: all 0.2s ease;
      font-weight: 500;
    }
    button:hover {
      background: #334155;
      border-color: #38bdf8;
      color: #38bdf8;
    }
    button.active {
      background: #0284c7;
      border-color: #38bdf8;
      color: white;
    }
    .download-btn {
      grid-column: span 2;
      background: linear-gradient(135deg, #2563eb, #0284c7);
      border: none;
      color: white;
      font-weight: 600;
      margin-top: 6px;
      padding: 10px;
    }
    .download-btn:hover {
      background: linear-gradient(135deg, #1d4ed8, #0369a1);
      color: #fff;
    }
    .instructions {
      position: absolute;
      bottom: 20px;
      left: 50%;
      transform: translateX(-50%);
      background: rgba(15, 23, 42, 0.75);
      backdrop-filter: blur(8px);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 8px 18px;
      border-radius: 20px;
      font-size: 0.8rem;
      color: #94a3b8;
      pointer-events: none;
    }
  </style>
  <!-- Three.js + OrbitControls + OBJLoader + MTLLoader -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
</head>
<body>

  <div id="canvas-container"></div>

  <div class="ui-panel">
    <div class="title">3D Модель Человека</div>
    <div class="subtitle">Полноразмерная анатомическая 3D-модель (рост ~178 см, голова, туловище, плечевой пояс, руки, кисти, бедра, ноги, обувь).</div>

    <div class="stat-row">
      <span class="stat-label">Полигонов (граней):</span>
      <span class="stat-value" id="face-count">6 176</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Вершин:</span>
      <span class="stat-value" id="vertex-count">3 602</span>
    </div>
    <div class="stat-row">
      <span class="stat-label">Форматы:</span>
      <span class="stat-value">OBJ + MTL, GLTF</span>
    </div>

    <div class="controls-grid">
      <button id="btn-rotate" class="active" onclick="toggleRotation()">Авто-вращение</button>
      <button id="btn-wireframe" onclick="toggleWireframe()">Сетка (Wireframe)</button>
      <button onclick="resetCamera()">Сброс камеры</button>
      <button onclick="toggleLight()">Освещение (Студия)</button>
      <a href="human.obj" download="human.obj" style="grid-column: span 1; text-decoration: none;">
        <button style="width: 100%;">Скачать .OBJ</button>
      </a>
      <a href="human.gltf" download="human.gltf" style="grid-column: span 1; text-decoration: none;">
        <button style="width: 100%;">Скачать .GLTF</button>
      </a>
      <a href="human.mtl" download="human.mtl" style="grid-column: span 2; text-decoration: none;">
        <button class="download-btn" style="width: 100%;">Скачать материалы (.MTL)</button>
      </a>
    </div>
  </div>

  <div class="instructions">
    🖱️ ЛКМ: вращение | ПКМ: панорамирование | Колёсико: зум
  </div>

  <script>
    let scene, camera, renderer, controls;
    let humanGroup = null;
    let autoRotate = true;
    let isWireframe = false;
    let studioLightMode = false;
    let keyLight, fillLight, backLight;

    function init() {
      const container = document.getElementById('canvas-container');

      // Scene
      scene = new THREE.Scene();
      scene.background = new THREE.Color(0x0b1120);
      scene.fog = new THREE.FogExp2(0x0b1120, 0.0035);

      // Camera
      camera = new THREE.PerspectiveCamera(45, window.innerWidth / window.innerHeight, 1, 1000);
      camera.position.set(0, 100, 280);

      // Renderer
      renderer = new THREE.WebGLRenderer({ antialias: true });
      renderer.setPixelRatio(window.devicePixelRatio);
      renderer.setSize(window.innerWidth, window.innerHeight);
      renderer.shadowMap.enabled = true;
      renderer.shadowMap.type = THREE.PCFSoftShadowMap;
      renderer.toneMapping = THREE.ACESFilmicToneMapping;
      renderer.toneMappingExposure = 1.1;
      container.appendChild(renderer.domElement);

      // Controls
      controls = new THREE.OrbitControls(camera, renderer.domElement);
      controls.target.set(0, 95, 0);
      controls.enableDamping = true;
      controls.dampingFactor = 0.05;
      controls.minDistance = 30;
      controls.maxDistance = 500;
      controls.maxPolarAngle = Math.PI / 2 + 0.05;

      // Lighting Setup (3-point cinematic lighting)
      const ambientLight = new THREE.AmbientLight(0xffffff, 0.45);
      scene.add(ambientLight);

      keyLight = new THREE.DirectionalLight(0xfff5ea, 1.2);
      keyLight.position.set(80, 180, 120);
      keyLight.castShadow = true;
      keyLight.shadow.mapSize.width = 2048;
      keyLight.shadow.mapSize.height = 2048;
      keyLight.shadow.bias = -0.0005;
      scene.add(keyLight);

      fillLight = new THREE.DirectionalLight(0x7dd3fc, 0.6);
      fillLight.position.set(-100, 120, 80);
      scene.add(fillLight);

      backLight = new THREE.DirectionalLight(0xa855f7, 0.8);
      backLight.position.set(0, 160, -120);
      scene.add(backLight);

      // Floor Grid & Shadow receiver
      const floorGeo = new THREE.PlaneGeometry(500, 500);
      const floorMat = new THREE.MeshStandardMaterial({
        color: 0x0f172a,
        roughness: 0.85,
        metalness: 0.1
      });
      const floor = new THREE.Mesh(floorGeo, floorMat);
      floor.rotation.x = -Math.PI / 2;
      floor.position.y = 0;
      floor.receiveShadow = true;
      scene.add(floor);

      const gridHelper = new THREE.GridHelper(300, 30, 0x38bdf8, 0x1e293b);
      gridHelper.position.y = 0.1;
      scene.add(gridHelper);

      // Load OBJ & MTL
      loadHumanModel();

      // Events
      window.addEventListener('resize', onWindowResize);

      // Render Loop
      animate();
    }

    function loadHumanModel() {
      const mtlLoader = new THREE.MTLLoader();
      mtlLoader.load('human.mtl', function (materials) {
        materials.preload();

        // Enhance materials
        for (let matName in materials.materials) {
          const mat = materials.materials[matName];
          mat.roughness = 0.55;
          mat.metalness = 0.05;
        }

        const objLoader = new THREE.OBJLoader();
        objLoader.setMaterials(materials);
        objLoader.load('human.obj', function (object) {
          humanGroup = object;
          humanGroup.traverse(function (child) {
            if (child.isMesh) {
              child.castShadow = true;
              child.receiveShadow = true;
            }
          });
          scene.add(humanGroup);
        });
      });
    }

    function toggleRotation() {
      autoRotate = !autoRotate;
      const btn = document.getElementById('btn-rotate');
      if (autoRotate) {
        btn.classList.add('active');
      } else {
        btn.classList.remove('active');
      }
    }

    function toggleWireframe() {
      isWireframe = !isWireframe;
      const btn = document.getElementById('btn-wireframe');
      btn.classList.toggle('active', isWireframe);

      if (humanGroup) {
        humanGroup.traverse(function (child) {
          if (child.isMesh) {
            if (Array.isArray(child.material)) {
              child.material.forEach(m => m.wireframe = isWireframe);
            } else if (child.material) {
              child.material.wireframe = isWireframe;
            }
          }
        });
      }
    }

    function resetCamera() {
      camera.position.set(0, 100, 280);
      controls.target.set(0, 95, 0);
      controls.update();
    }

    function toggleLight() {
      studioLightMode = !studioLightMode;
      if (studioLightMode) {
        keyLight.color.setHex(0xffffff);
        fillLight.color.setHex(0xffffff);
        backLight.color.setHex(0xffffff);
        scene.background.setHex(0x1e293b);
      } else {
        keyLight.color.setHex(0xfff5ea);
        fillLight.color.setHex(0x7dd3fc);
        backLight.color.setHex(0xa855f7);
        scene.background.setHex(0x0b1120);
      }
    }

    function onWindowResize() {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    }

    function animate() {
      requestAnimationFrame(animate);

      if (autoRotate && humanGroup) {
        humanGroup.rotation.y += 0.008;
      }

      controls.update();
      renderer.render(scene, camera);
    }

    init();
  </script>
</body>
</html>
